spring:
  application:
    name: forge-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/forge_db
    username: postgres
    password: rm#123456
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true

server:
  port: 8080

# -----------------------------------------------------------------------
# FORGE custom configuration
# -----------------------------------------------------------------------
forge:
  worker:
    heartbeat:
      # Maximum age (seconds) of a heartbeat before the worker is marked OFFLINE.
      timeout-seconds: 120
      # How often (ms) the health-check @Scheduled method runs.
      check-interval-ms: 60000

  scheduler:
    round-robin:
      # Time quantum (ms) for RoundRobin scheduling (enforced by the C++ engine in Phase 2).
      quantum-ms: 500

logging:
  level:
    com.forge: DEBUG
    org.springframework.scheduling: INFO