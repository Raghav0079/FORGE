spring:
  application:
    name: backend

  datasource:
    url: jdbc:postgresql://localhost:5432/forge_db
    username: postgres
    password: rm#123456
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true

server:
  port: 8080