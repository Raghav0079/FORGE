# Test profile — used by @SpringBootTest
# Replaces PostgreSQL with H2 in-memory for fast, isolated context tests.
spring:
  datasource:
    url: jdbc:h2:mem:forge_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  flyway:
    enabled: false
    baseline-on-migrate: true
    baseline-version: 0

forge:
  worker:
    heartbeat:
      timeout-seconds: 120
      check-interval-ms: 60000
  scheduler:
    round-robin:
      quantum-ms: 500
